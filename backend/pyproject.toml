[project]
name = "claimsathi-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
# Runtime deps: keep identical to requirements.txt (tests/test_dependencies.py checks).
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "PyYAML==6.0.2",
    "Jinja2==3.1.5",
    "PyJWT==2.10.1",
    "cryptography==46.0.7",
    "python-multipart==0.0.20",
    "sarvamai==0.1.49",
    "httpx==0.28.1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
